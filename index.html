<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon carnet de recettes</title>
<meta name="theme-color" content="#2a6a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recettes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Réglages de base d'une page autonome */
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Connexion et pied de page */
.authbox { max-width: 420px; margin: 10vh auto 0; }
.foot { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 20px; padding-top: 12px; border-top: 1px dashed var(--line); }

/* Layout: une colonne de carnet. Trois vues (recettes, fiche, courses) sous une même barre d'onglets. Quantités toujours stockées par personne. */
:root {
  --bg: #f4f6f2;
  --surface: #ffffff;
  --fg: #1c2a25;
  --muted: #5d6c65;
  --line: #d9dfd8;
  --accent: #2a6a4d;
  --accent-fg: #ffffff;
  --accent-soft: #e0eee6;
  --warn: #a8570f;
  --warn-soft: #f8e9d6;
  --danger: #b3261e;
  --scrim: rgba(18, 28, 23, .5);
  --font-display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131b18; --surface: #1b2621; --fg: #e6ede8; --muted: #9aaba2; --line: #2d3b34;
    --accent: #6fcf9d; --accent-fg: #0d1a13; --accent-soft: #21382c;
    --warn: #f0b36b; --warn-soft: #3a2c18; --danger: #ff8a80; --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131b18; --surface: #1b2621; --fg: #e6ede8; --muted: #9aaba2; --line: #2d3b34;
  --accent: #6fcf9d; --accent-fg: #0d1a13; --accent-soft: #21382c;
  --warn: #f0b36b; --warn-soft: #3a2c18; --danger: #ff8a80; --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font: 16px/1.5 var(--font-body);
  padding-block: 24px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 720px; margin: 0 auto; display: grid; gap: 20px; }
section.view { display: grid; gap: 20px; }
h1 { font: 700 clamp(1.8rem, 6vw, 2.5rem)/1.08 var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; overflow-wrap: anywhere; }
h2 { font: 700 1.2rem/1.2 var(--font-display); margin: 0; }
.sub { color: var(--muted); margin: 6px 0 0; font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

/* Onglets */
.tabs { display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 5px; }
.tab { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; background: transparent; padding: 9px 6px; border-radius: 10px; font-size: .92rem; cursor: pointer; font-weight: 500; }
.tab[aria-current="page"] { background: var(--accent); color: var(--accent-fg); font-weight: 700; }
.badge { min-width: 1.35em; padding: 0 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: .8rem; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
.tab[aria-current="page"] .badge { background: var(--accent-fg); color: var(--accent); }
.badge:empty { display: none; }

/* Champs et boutons */
.add { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.add-row { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 560px) { .add-row { grid-template-columns: 1fr 150px 110px auto; } }
input[type=text], input[type=search], input[type=number], select, textarea {
  width: 100%; min-width: 0; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
}
textarea { resize: vertical; min-height: 96px; line-height: 1.45; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; border-radius: 10px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:hover { background: var(--accent-soft); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.btn.small { padding: 6px 12px; font-size: .9rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary:disabled, .btn.primary:disabled:hover { background: var(--bg); color: var(--muted); border-color: var(--line); filter: none; opacity: .7; }
.hint { font-size: .85rem; color: var(--muted); margin: 0; min-height: 1.3em; }
.hint.ok { color: var(--accent); font-weight: 500; }
.icon-btn { background: none; border: 0; cursor: pointer; padding: 8px; border-radius: 10px; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; font-size: 1.35rem; line-height: 1; }
.icon-btn:hover { background: var(--accent-soft); color: var(--accent); }
.icon-btn[aria-pressed="true"] { color: var(--warn); }
.icon-btn.cart { color: var(--accent); }
.icon-btn.danger-ic:hover { color: var(--danger); }

/* Liste de recettes */
.tools { display: grid; gap: 12px; }
.searchrow { display: flex; gap: 10px; }
.searchrow input { flex: 1; min-width: 0; }
.searchrow .btn { flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: .9rem; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
ul.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; display: flex; align-items: center; gap: 4px; padding: 6px 8px 6px 14px; }
.card-main { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 8px 0; cursor: pointer; display: grid; gap: 2px; }
.card:hover { border-color: var(--accent); }
.name { font: 700 1.1rem/1.25 var(--font-display); overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: .85rem; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.tag { background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 0 7px; font-weight: 500; }
.tag.todo { background: var(--warn-soft); color: var(--warn); }
.state { text-align: center; color: var(--muted); padding: 28px 12px; border: 1px dashed var(--line); border-radius: 14px; display: grid; gap: 10px; justify-items: center; }
.state strong { display: block; color: var(--fg); font: 700 1.1rem var(--font-display); }

/* Fiche recette */
.topbar { display: flex; align-items: center; gap: 4px; }
.topbar .spacer { flex: 1; }
.back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; cursor: pointer; color: var(--accent); font-weight: 700; padding: 8px 8px 8px 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.panel h3, .label-up { margin: 0; font: 700 .78rem/1 var(--font-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.portions { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.st-btn { width: 40px; height: 40px; border: 0; background: transparent; font-size: 1.4rem; line-height: 1; cursor: pointer; border-radius: 12px; }
.st-btn:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent); }
.st-btn:disabled { opacity: .35; cursor: not-allowed; }
.st-val { min-width: 2.2em; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.stepper.sm .st-btn { width: 34px; height: 34px; }
ul.ings { list-style: none; margin: 0; padding: 0; display: grid; }
ul.ings li { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
ul.ings li:last-child { border-bottom: 0; }
ul.ings .q { font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; text-align: right; }
ol.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
ol.steps li { display: grid; gap: 2px; max-width: 65ch; }
ol.steps .n { font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.empty-line { color: var(--muted); font-style: italic; margin: 0; }
.notes { margin: 0; max-width: 65ch; white-space: pre-line; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* Formulaire d'édition */
.form { display: grid; gap: 14px; }
.form label { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }
.form label input, .form label select, .form label textarea { font-size: 1rem; color: var(--fg); }
.form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ing-rows { display: grid; gap: 8px; }
.ing-row { display: grid; grid-template-columns: minmax(0, 1fr) 68px 92px 36px; gap: 6px; align-items: center; }
.ing-row .icon-btn { padding: 6px; font-size: 1.2rem; }
.units-help { font-size: .8rem; color: var(--muted); margin: 0; }

/* Meal finder */
.progress { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.q-title { font: 700 clamp(1.3rem, 4.5vw, 1.7rem)/1.2 var(--font-display); margin: 0; text-wrap: balance; }
.q-sub { color: var(--muted); margin: 0; font-size: .9rem; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choice { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 16px; cursor: pointer; font-weight: 500; text-align: left; }
.choice:hover { border-color: var(--accent); }
.choice[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 700; }
.choice small { display: block; font-weight: 400; opacity: .8; font-size: .78rem; }
.choice.ghost { background: transparent; border-style: dashed; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; background: var(--bg); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 8px 14px; border-radius: 9px; cursor: pointer; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 700; }
.why { display: flex; flex-wrap: wrap; gap: 6px; }
.tag.alt { background: var(--warn-soft); color: var(--warn); }
.owned { margin: 0; font-size: .9rem; color: var(--muted); }
.owned b { color: var(--fg); font-weight: 700; }
.ing-pick { max-height: 280px; overflow: auto; padding: 2px; }
.panel.fill { display: flex; flex-direction: column; gap: 14px; min-height: var(--fill, 420px); }
.panel.fill > .actions { margin-top: auto; padding-top: 8px; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px; }
.panel.fill > .actions .btn { padding: 14px 16px; font-size: 1rem; border-radius: 14px; }
.panel.fill .choices { display: grid; grid-template-columns: 1fr; gap: 10px; }
.panel.fill .choices.cols2 { grid-template-columns: 1fr 1fr; }
.panel.fill .choice { width: 100%; padding: 15px 16px; font-size: 1rem; border-radius: 14px; overflow-wrap: anywhere; }
.panel.fill .seg { display: grid; grid-template-columns: 1fr 1fr; }
.panel.fill .seg button { padding: 12px 10px; }
.pgroup { gap: 8px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { padding: 6px 11px; border-radius: 10px; border: 1px solid transparent; background: var(--bg); color: var(--muted); cursor: pointer; font-size: .88rem; font-weight: 400; line-height: 1.3; }
.pill:hover { color: var(--fg); }
.pill[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.ac { position: relative; min-width: 0; }
.ac-list { position: absolute; z-index: 20; left: 0; top: 100%; min-width: 100%; width: max-content; max-width: 80vw; margin: 4px 0 0; padding: 4px; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, .18); max-height: 260px; overflow: auto; }
.ac-list li { padding: 10px 12px; border-radius: 8px; cursor: pointer; overflow-wrap: anywhere; }
.ac-list li[aria-selected="true"], .ac-list li:hover { background: var(--accent-soft); }
.ac-list li.ac-add { color: var(--accent); font-weight: 700; }
.btn.wide { width: 100%; padding: 14px 16px; font-size: 1rem; border-radius: 14px; }
.linkrow { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 20px; }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 8px 4px; font-size: .92rem; }
.linkbtn:hover { color: var(--accent); }
.tip { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: .92rem; }
.pick-name { font: 700 clamp(1.5rem, 5vw, 2rem)/1.15 var(--font-display); margin: 0; overflow-wrap: anywhere; text-wrap: balance; }

/* Courses */
.cart-recipes { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.cart-recipes li { display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 14px; background: var(--bg); border-radius: 12px; }
.cart-recipes .nm { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; font-weight: 700; overflow-wrap: anywhere; }
.shop { list-style: none; margin: 0; padding: 0; display: grid; }
.shop li { border-bottom: 1px dashed var(--line); }
.shop li:last-child { border-bottom: 0; }
.shop label { display: flex; align-items: center; gap: 12px; padding: 11px 2px; cursor: pointer; }
.shop input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.shop .it { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.shop .q { font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; }
.shop li.done .it, .shop li.done .q { color: var(--muted); text-decoration: line-through; }
.row-between { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }

/* Fenêtre « combien de personnes » et message */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; z-index: 30; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 560px) { .scrim { align-items: center; } }
.dialog { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; width: 100%; max-width: 380px; display: grid; gap: 16px; }
.dialog .portions { justify-content: center; flex-direction: column; gap: 10px; }
.dialog .stepper .st-btn { width: 52px; height: 52px; font-size: 1.6rem; }
.dialog .st-val { font-size: 1.5rem; min-width: 2.4em; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 500; z-index: 40; max-width: calc(100% - 32px); text-align: center; }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s; } }
</style>
</head>
<body>
<div class="authbox" id="authBox" hidden>
  <form class="panel form" id="loginForm">
    <h2>Mon carnet de recettes</h2>
    <label for="loginEmail">E-mail<input type="email" id="loginEmail" autocomplete="username" required></label>
    <label for="loginPass">Mot de passe<input type="password" id="loginPass" autocomplete="current-password" required></label>
    <p class="hint" id="loginErr" role="alert"></p>
    <button class="btn primary" id="loginBtn" type="submit">Se connecter</button>
  </form>
</div>
<main id="appMain" hidden>
  <header>
    <p class="sub" id="count" hidden></p>
  </header>

  <nav class="tabs" aria-label="Sections">
    <button class="tab" id="tabList" type="button"><span>Recettes</span></button>
    <button class="tab" id="tabFinder" type="button"><span>Meal finder</span></button>
    <button class="tab" id="tabCart" type="button"><span id="tabCartIcon"></span><span>Courses</span><span class="badge" id="nCart"></span></button>
  </nav>

  <!-- Vue : liste -->
  <section class="view" id="vList">
    <div class="searchrow">
      <input type="search" id="search" placeholder="Rechercher…" aria-label="Rechercher">
      <button class="btn primary" id="addBtn" type="button">Ajouter</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filtrer par catégorie"></div>
    <ul class="list" id="list"></ul>
    <div id="status"></div>
  </section>

  <!-- Vue : fiche recette -->
  <section class="view" id="vRecipe" hidden></section>

  <!-- Vue : meal finder -->
  <section class="view" id="vFinder" hidden></section>

  <!-- Vue : courses -->
  <section class="view" id="vCourses" hidden></section>

  <footer class="foot">
    <button class="linkbtn" id="exportBtn" type="button">Exporter mes recettes</button>
    <button class="linkbtn" id="importBtn" type="button">Importer</button>
    <button class="linkbtn" id="logoutBtn" type="button">Se déconnecter</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </footer>
</main>

<div id="modalRoot"></div>
<div id="toastRoot"></div>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

(function () {

  // Alerte « je n'arrive pas à me décider » : une entrée par réponse.

      actions: [
        { label: "Une recette rapide", kind: "recipe", mode: "fast" },

        { label: "De la nourriture à emporter", kind: "ideas", title: "À emporter", items: ["Chinois", "Pizzeria", "Kebab", "Sushi", "Burger", "Indien", "Poke bowl"] }
      ]
    }
  };
  var COMPS = ["Riz", "Pâtes", "Viande", "Œufs", "Poisson", "Légumes", "Pommes de terre", "Purée"];
  var BASICS = ["sel", "poivre", "eau", "huile d'olive"];
  var finder = null;
  var recipes = [];

  }

    var r = finder.cur.r, comps = r.composants || [], sel = finder.askSel;
    var panel = h("div", { class: "panel" });
    panel.appendChild(h("div", {}, [h("h2", { class: "q-title", text: "Qu'est-ce qui ne te donne pas envie ?" }), h("p", { class: "q-sub", text: "Dans « " + r.name + " »." })]));
    var cm = h("div", { class: "choices" });
    cm.className = "choices cols2"; comps.forEach(function (o) { cm.appendChild(chipBtn(o, sel.indexOf(o) >= 0, function () { toggle(sel, o); finder.askUnknown = false; renderFinder(); })); });
    cm.appendChild(chipBtn("Je ne sais pas", !!finder.askUnknown, function () { finder.askSel = []; finder.askUnknown = true; renderFinder(); }));
    panel.appendChild(cm);
    panel.appendChild(h("div", { class: "actions" }, [
      h("button", { class: "btn", type: "button", text: "Retour", onclick: function () { finder.phase = "result"; renderFinder(); } }),
      h("button", { class: "btn primary", type: "button", text: "Nouvelle proposition", disabled: sel.length === 0 && !finder.askUnknown, onclick: function () {
        sel.forEach(function (c) { if (finder.rej.indexOf(c) < 0) finder.rej.push(c); });
        finder.askSel = []; propose();
      } })]));
    box.appendChild(panel);
  }

  // Écran qui suit une réponse « oui » à l'alerte, construit à partir de ALERTS.
  function alertView(box) {
    var al = ALERTS[finder.a.mood];
    var panel = h("div", { class: "panel" });
    panel.appendChild(h("div", {}, [h("h2", { class: "q-title", text: al.title }), h("p", { class: "q-sub", text: al.intro })]));
    var ch = h("div", { class: "choices" });
    al.actions.forEach(function (act) {
      ch.appendChild(chipBtn(act.label, false, function () {
        if (act.kind === "ideas") { finder.idea = { act: act, i: -1 }; nextIdea(); finder.phase = "ideas"; renderFinder(); }
        else { finder.mode = act.mode; finder.shown = []; finder.rej = []; propose(); }
      }));
    });
    panel.appendChild(ch);
    panel.appendChild(h("div", { class: "actions" }, [h("button", { class: "btn", type: "button", text: "Retour", onclick: function () { finder.phase = "quiz"; renderFinder(); } })]));
    box.appendChild(panel);
  }
  function nextIdea() {
    var items = finder.idea.act.items, i;
    do { i = Math.floor(Math.random() * items.length); } while (items.length > 1 && i === finder.idea.i);
    finder.idea.i = i;
  }
  function ideasView(box) {
    var id = finder.idea;
    var panel = h("div", { class: "panel" });
    panel.appendChild(h("span", { class: "label-up", text: id.act.title }));
    panel.appendChild(h("h2", { class: "pick-name", text: id.act.items[id.i] }));
    panel.appendChild(h("div", { class: "actions" }, [
      h("button", { class: "btn", type: "button", text: "Retour", onclick: function () { finder.phase = "alert"; renderFinder(); } }),
      h("button", { class: "btn primary", type: "button", text: "Une autre idée", onclick: function () { nextIdea(); renderFinder(); } })]));
    box.appendChild(panel);
  }

  function noneView(box) {
    box.appendChild(h("div", { class: "state" }, [
      h("strong", { text: "Plus rien à te proposer" }),
      finder.shown.length ? "Tu as fait le tour des recettes qui correspondent à tes réponses." : "Aucune recette ne correspond à ces réponses. Vérifie aussi que tes recettes ont leur ambiance, leurs composants et leur temps renseignés.",
      h("div", { class: "actions", style: "justify-content:center" }, [
        h("button", { class: "btn primary", type: "button", text: "Modifier mes réponses", onclick: function () { newFinder(true); renderFinder(); } }),
        h("button", { class: "btn", type: "button", text: "Recommencer", onclick: function () { newFinder(false); renderFinder(); } })])]));
  }

  // ----- Rendu global
  function renderAll() {
    var rt = getRoute();
    $("vList").hidden = rt.v !== "list"; $("vRecipe").hidden = rt.v !== "recipe"; $("vCourses").hidden = rt.v !== "courses"; $("vFinder").hidden = rt.v !== "finder";
    $("tabList").setAttribute("aria-current", rt.v === "list" || rt.v === "recipe" ? "page" : "false");
    $("tabFinder").setAttribute("aria-current", rt.v === "finder" ? "page" : "false");
    $("tabCart").setAttribute("aria-current", rt.v === "courses" ? "page" : "false");
    var total = recipes.length;
    $("nCart").textContent = cart.items.length ? String(cart.items.length) : "";
    if (rt.v === "list") renderList();
    else if (rt.v === "recipe") renderRecipe(rt.id);
    else if (rt.v === "finder") renderFinder();
    else renderCourses();
  }
  $("tabList").addEventListener("click", function () { go(""); });
  $("tabCart").addEventListener("click", function () { go("courses"); });
  $("tabFinder").addEventListener("click", function () { go("finder"); });
  $("tabCartIcon").appendChild(cartIcon());
  $("tabList").setAttribute("aria-current", "page");

  renderAll();

  lastView = getRoute().v;

  // ----- Fenêtre de confirmation générique
  function confirmBox(title, text, okLabel, fn) {
    var root = $("modalRoot"); root.textContent = "";
    function close() { root.textContent = ""; document.removeEventListener("keydown", onKey); }
    function onKey(e) { if (e.key === "Escape") close(); }
    var cancel = h("button", { class: "btn", type: "button", text: "Annuler", onclick: close });
    var ok = h("button", { class: "btn primary", type: "button", text: okLabel, onclick: function () { close(); fn(); } });
    var dlg = h("div", { class: "dialog", role: "alertdialog", "aria-modal": "true", "aria-labelledby": "cbTitle" }, [
      h("div", {}, [h("h2", { id: "cbTitle", text: title }), h("p", { class: "sub", text: text })]),
      h("div", { class: "actions", style: "justify-content:flex-end" }, [cancel, ok])
    ]);
    var scrim = h("div", { class: "scrim", onclick: function (e) { if (e.target === scrim) close(); } }, [dlg]);
    root.appendChild(scrim);
    document.addEventListener("keydown", onKey);
    cancel.focus();
  }

  // ----- Exporter / importer (sauvegarde)
  function commitChunks(items) {
    var chunks = [];
    for (var k = 0; k < items.length; k += 400) chunks.push(items.slice(k, k + 400));
    return chunks.reduce(function (p, ch) {
      return p.then(function () { var b = db.batch(); ch.forEach(function (it) { b.set(it.ref, it.data); }); return b.commit(); });
    }, Promise.resolve());
  }
  $("exportBtn").addEventListener("click", function () {
    var data = { app: "carnet-recettes", version: 1, exportedAt: new Date().toISOString(), recettes: recipes, panier: cart };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "recettes-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });
  $("importBtn").addEventListener("click", function () { $("importFile").click(); });
  $("importFile").addEventListener("change", function () {
    var f = this.files[0]; this.value = "";
    if (!f || !db) return;
    var reader = new FileReader();
    reader.onload = function () {
      var data;
      try { data = JSON.parse(reader.result); } catch (e) { toast("Fichier illisible."); return; }
      var list = Array.isArray(data.recettes) ? data.recettes.filter(function (r) { return r && typeof r.id === "string" && r.id && r.id.indexOf("/") < 0; }) : [];
      if (!list.length) { toast("Aucune recette dans ce fichier."); return; }
      confirmBox("Importer " + list.length + (list.length > 1 ? " recettes ?" : " recette ?"), "Les recettes qui ont le même identifiant seront remplacées.", "Importer", function () {
        var items = list.map(function (r) { var d = Object.assign({}, r); delete d.id; return { ref: db.doc("recettes/" + r.id), data: d }; });
        if (data.panier && Array.isArray(data.panier.items)) items.push({ ref: db.doc("panier/main"), data: { items: data.panier.items, checked: Array.isArray(data.panier.checked) ? data.panier.checked : [] } });
        commitChunks(items).then(function () { toast(list.length + (list.length > 1 ? " recettes importées" : " recette importée")); })
          .catch(function () { toast("Import impossible, réessaie."); });
      });
    };
    reader.readAsText(f);
  });

  // ----- Connexion (Firebase Authentication) et stockage (Firestore)
  var timer = null, unsubs = [];
  function showAuth(msg, locked) {
    $("authBox").hidden = false; $("appMain").hidden = true;
    $("loginErr").textContent = msg || "";
    $("loginBtn").disabled = !!locked;
  }
  function stopApp() {
    unsubs.forEach(function (f) { try { f(); } catch (e) {} });
    unsubs = []; clearTimeout(timer);
    recipes = []; cart = { items: [], checked: [] }; loaded = false; db = null;
  }
  function startApp() {
    $("authBox").hidden = true; $("appMain").hidden = false;
    db = firebase.firestore(); canWrite = true; $("addBtn").hidden = false;
    renderAll();
    timer = setTimeout(function () { if (!loaded) { $("count").hidden = false; $("count").textContent = "Les recettes mettent du temps à arriver…"; } }, 10000);
    unsubs.push(db.collection("recettes").orderBy("createdAt", "desc").onSnapshot(function (snap) {
      recipes = snap.docs.map(function (d) { return Object.assign({}, d.data() || {}, { id: d.id }); });
      if (!snap.metadata.fromCache || snap.docs.length) { loaded = true; clearTimeout(timer); }
      $("count").hidden = true;
      if (editing) return;
      renderAll();
    }, function () { clearTimeout(timer); loaded = true; $("count").hidden = false; $("count").textContent = "Lecture impossible pour le moment"; renderAll(); }));
    unsubs.push(db.doc("panier/main").onSnapshot(function (snap) {
      if (cartWriting || cartDirty) return;
      var d = snap.exists ? snap.data() : null;
      cart = { items: d && Array.isArray(d.items) ? d.items.map(function (x) { return { rid: x.rid, n: Number(x.n) || 1 }; }) : [],
               checked: d && Array.isArray(d.checked) ? d.checked.slice() : [] };
      if (editing) return;
      renderAll();
    }, function () {}));
  }

  var cfg = window.FIREBASE_CONFIG;
  if (typeof firebase === "undefined") {
    showAuth("Impossible de charger Firebase. Vérifie ta connexion internet.", true);
  } else if (!cfg || !cfg.apiKey || /COLLE/.test(cfg.apiKey)) {
    showAuth("Configuration manquante : ouvre le fichier firebase-config.js et colle la configuration de ton projet Firebase (voir LISEZMOI.md).", true);
  } else {
    firebase.initializeApp(cfg);
    firebase.auth().onAuthStateChanged(function (user) {
      if (user) startApp(); else { stopApp(); showAuth(""); }
    });
    $("loginForm").addEventListener("submit", function (ev) {
      ev.preventDefault();
      $("loginErr").textContent = ""; $("loginBtn").disabled = true;
      firebase.auth().signInWithEmailAndPassword($("loginEmail").value.trim(), $("loginPass").value)
        .catch(function (e) {
          var c = e && e.code;
          $("loginErr").textContent = c === "auth/too-many-requests" ? "Trop d'essais. Réessaie dans quelques minutes."
            : c === "auth/network-request-failed" ? "Pas de connexion internet."
            : "E-mail ou mot de passe incorrect.";
        }).then(function () { $("loginBtn").disabled = false; });
    });
    $("logoutBtn").addEventListener("click", function () { firebase.auth().signOut(); });
  }
})();
</script>
</body>
</html>
